version: "3.9"
services:
  inaseg:
    image: ipynb-inaseg
    build: .
    volumes:
      - .:/inaseg
      - /vol1/1000/biliup/data/rec/merged:/recording
    command: python /inaseg/watcher.py --watch_interval=43200
    restart: unless-stopped
  inacelery:
    image: ipynb-inaseg
    build: .
    volumes:
      - .:/inaseg
      - /vol1/1000/biliup/data/rec/merged:/recording
      
    command: celery -A inacelery worker -c 1 --loglevel=info
    restart: unless-stopped
